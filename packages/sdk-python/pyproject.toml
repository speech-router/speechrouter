[project]
name = "speechrouter"
version = "0.0.1"
description = "One API for every speech model — official SDK for speechrouter.ai (coming soon; the OpenAI SDK works today for batch)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
keywords = ["speech-to-text", "stt", "transcription", "streaming", "websocket"]

[project.urls]
Homepage = "https://speechrouter.ai"
Repository = "https://github.com/speech-router/speechrouter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speechrouter"]
